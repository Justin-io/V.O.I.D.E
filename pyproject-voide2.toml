[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voide"
version = "2.0.0"
description = "Industrial digital twin and predictive intelligence platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2.0,<4",
  "scikit-learn>=1.3,<2",
  "fastapi>=0.110,<1",
  "pydantic>=2.6,<3",
  "uvicorn[standard]>=0.27,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.23,<2",
  "httpx>=0.27,<1",
  "ruff>=0.5,<1",
]

[project.scripts]
voide2 = "voide2.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["voide2*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
