<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>V.O.I.D.E. Fixture 4 - Deeply Nested Wrappers & Dynamic Elements</title>
</head>
<body>
  <div class="root">
    <div class="layout-flex">
      <div class="inner-viewport">
        <div class="portal-root">
          <div class="input-nest-1">
            <div class="input-nest-2">
              <div class="input-nest-3">
                <textarea id="dynamic-chat-input" placeholder="Ask AI anything..." aria-label="Ask chat assistant"></textarea>
              </div>
            </div>
          </div>
          <div class="button-nest-1">
            <div class="button-nest-2">
              <button id="dynamic-send-btn" aria-label="Send message" disabled>
                <span><span>Send</span></span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
