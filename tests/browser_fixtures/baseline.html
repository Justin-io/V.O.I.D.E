<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>V.O.I.D.E. Fixture 1 - Baseline</title>
</head>
<body>
  <div id="app" class="chat-container">
    <header class="header">
      <h1>AI Assistant</h1>
    </header>
    <main class="conversation">
      <div class="message assistant">Hello! How can I assist you today?</div>
    </main>
    <footer class="composer">
      <textarea id="prompt-input" class="chat-input" placeholder="Type a message..."></textarea>
      <button id="send-button" class="btn-send" type="button">Send</button>
    </footer>
  </div>
</body>
</html>
