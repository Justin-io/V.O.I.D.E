[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voide"
version = "2.0.0"
description = "V.O.I.D.E. industrial telemetry analytics and digital twin"
readme = "README.md"
authors = [{ name = "V.O.I.D.E. Contributors" }]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["telemetry", "industrial-iot", "digital-twin", "predictive-maintenance"]
dependencies = [
  "websockets>=12,<16",
  "numpy>=1.24,<3",
  "pandas>=2,<4",
  "scikit-learn>=1.3,<2",
  "python-dotenv>=1,<2",
  "fastapi>=0.110,<1",
  "pydantic>=2.6,<3",
  "uvicorn[standard]>=0.27,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.23,<2",
  "httpx>=0.27,<1",
  "ruff>=0.5,<1",
]

[project.scripts]
voide-daemon = "agent.runtime.ipc_server:main"
voide2 = "voide2.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["native*", "browser*", "agent*", "packages*", "voide2*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.pyright]
pythonVersion = "3.13"
extraPaths = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
