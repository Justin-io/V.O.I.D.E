name: V.O.I.D.E. 2.0 CI

on:
  push:
    branches: [master, "feature/voide-2-digital-twin"]
    paths:
      - "voide2/**"
      - "tests/voide2/**"
      - "pyproject-voide2.toml"
      - ".github/workflows/voide2-ci.yml"
  pull_request:
    paths:
      - "voide2/**"
      - "tests/voide2/**"
      - "pyproject-voide2.toml"
      - ".github/workflows/voide2-ci.yml"

jobs:
  voide2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install V.O.I.D.E. 2.0 dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip install -e . --no-deps
      - name: Syntax check
        run: python -m compileall -q voide2
      - name: Unit and integration tests
        run: python -m pytest -q tests/voide2
      - name: Reproducible end-to-end demo
        run: python -m voide2 demo --out artifacts/demo
      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: voide2-synthetic-benchmark
          path: artifacts/demo/benchmark
          if-no-files-found: error
